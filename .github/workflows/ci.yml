name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.30.0
          fmt_output=$(goimports -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          # Ratchet threshold: set at current coverage level (67%).
          # Increase as coverage improves — target: 80%.
          THRESHOLD=67
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Build binary
        run: go build -o bin/go-code ./cmd/go-code

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: gosec security scan
        uses: securego/gosec@master
        with:
          # Exclude rules that are expected false positives for a CLI tool:
          # G101: hardcoded credentials (env var names, not actual secrets)
          # G107: HTTP request with variable URL (expected — update checker, telemetry)
          # G118: goroutine uses context.Background (acceptable for TTY repl)
          # G122: filesystem race in WalkDir (acceptable for grep tool)
          # G204: subprocess with variable (expected — CLI runs user commands)
          # G301: directory permissions 0750 (expected — user-facing dirs need world-read)
          # G302: file permissions 0600 (expected — session files, logs need owner-only)
          # G304: file inclusion via variable (expected — CLI reads user files)
          # G703: path traversal (expected — CLI works with file paths)
          args: -exclude=G101,G104,G107,G118,G122,G204,G301,G302,G304,G306,G703 ./...

      - name: govulncheck vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  python-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r harness/requirements.txt
          pip install -e .

      - name: Build Go binary
        run: go build -o bin/go-code ./cmd/go-code

      - name: Run Python tests
        run: |
          mkdir -p harness/logs
          pytest harness/ -v --tb=short | tee harness/logs/pytest.log

      - name: Upload harness logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs
          path: harness/logs/
          retention-days: 7

  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build for linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o bin/go-code-linux-amd64 ./cmd/go-code

      - name: Build for darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build -o bin/go-code-darwin-amd64 ./cmd/go-code

      - name: Build for darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build -o bin/go-code-darwin-arm64 ./cmd/go-code

      - name: Build for windows/amd64
        run: GOOS=windows GOARCH=amd64 go build -o bin/go-code-windows-amd64.exe ./cmd/go-code

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: |
          cd docs
          npm ci

      - name: Build docs
        run: |
          cd docs
          npm run build

  workflow-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness
        run: |
          pip install -r harness/requirements.txt
          pip install -e .

      - name: Run workflow quality eval
        run: |
          pytest harness/test_workflow_quality.py -v --tb=short
          # Scorecard must be 100% green — PR blocked otherwise

      - name: Content quality check
        run: |
          python -c "
          from harness.workflow.content_check import ContentQualityChecker
          from pathlib import Path
          checker = ContentQualityChecker()
          result = checker.check(Path('.'))
          print(result.render())
          if not result.passed:
              print('::error::Content quality check failed — fix ARCHITECTURE.md or CONTRIBUTING.md')
              exit(1)
          "

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: claude-code-go:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
